version: 2
updates:
  - package-ecosystem: composer
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/infra/php"
    schedule:
      interval: weekly
    groups:
      php-docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/infra/mysql"
    schedule:
      interval: weekly
    groups:
      mysql-docker-minor-patch:
        update-types: [minor, patch]
